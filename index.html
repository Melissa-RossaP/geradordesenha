<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gerador de Senha</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gerador de Senhas</h1>
        </div>

        <div class="display-box">
            <span id="password">SENHA</span>
            <button  class="copy-btn" id="copyBtn" title="Copiar">Copiar</button>
        </div>

        <div class="custom-section"> 
            <h2>Personalize sua Senha</h2>


            <div class="control-group">
                <span class="control-label">Número de caracteres</span>
            </div>

            <div class="counter">
                <button  id="decrement">.</button>
                <span id="lengthVal">12</span>
                <button id="increment">+</button>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Gerar nova Senha</button>
    </div>
</div>
    
</body>
</html>
